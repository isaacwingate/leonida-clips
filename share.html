<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Leonida Clips posting helper</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<h1>Posting helper</h1>
<p>Opens TikTok Studio and hands it the clips waiting in this site's queue.</p>
<button id="go" type="button">Open TikTok Studio</button>
<pre id="log"></pre>
</main>
<script>
const log = (s) => { document.getElementById("log").textContent += s + "\n"; };
document.getElementById("go").onclick = () => {
  const w = window.open("https://www.tiktok.com/tiktokstudio/upload", "tt");
  log("opened: " + !!w);
};
window.addEventListener("message", async (e) => {
  if (e.origin !== "https://www.tiktok.com" || !e.data || typeof e.data.want !== "string") return;
  const name = e.data.want.replace(/[^\w.-]/g, "");
  try {
    const r = await fetch("clips/" + name, { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const buf = await r.arrayBuffer();
    e.source.postMessage({ file: name, buf }, e.origin, [buf]);
    log("sent " + name + " (" + buf.byteLength + " bytes)");
  } catch (err) {
    e.source.postMessage({ file: name, error: String(err) }, e.origin);
    log("failed " + name + ": " + err);
  }
});
</script>
</body>
</html>
